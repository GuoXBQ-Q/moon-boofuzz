name: MoonBit CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  core:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Install MoonBit
        if: runner.os == 'Linux'
        run: curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
      - name: Set toolchain path
        if: runner.os == 'Linux'
        run: echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Install MoonBit on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          irm https://cli.moonbitlang.com/install/powershell.ps1 | iex
          "$env:USERPROFILE\.moon\bin" >> $env:GITHUB_PATH
      - name: Install llvm-mingw (Windows native toolchain)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/mstorsjo/llvm-mingw/releases/download/20260616/llvm-mingw-20260616-ucrt-x86_64.zip" -OutFile "llvm-mingw.zip"
          Expand-Archive -Path "llvm-mingw.zip" -DestinationPath "C:\llvm-mingw"
          echo "C:\llvm-mingw\llvm-mingw-20260616-ucrt-x86_64\bin" >> $env:GITHUB_PATH
      - run: moon version --all
      - name: Initialize registry for standalone developer scripts
        run: moon update
      - run: moon check --deny-warn
      - run: moon build
      - run: moon test --deny-warn
      - run: moon check --target native --deny-warn
      - run: moon build --target native
      - run: moon test --target native --deny-warn
      - name: AddressSanitizer for native bridge
        if: runner.os == 'Linux'
        run: moon run scripts/asan.mbtx
      - run: moon run cmd/main
      - run: moon run --target native cmd/boofuzz -- generate examples/offline.json --limit 3
      - run: moon fmt --check
      - run: moon info
      - run: moon info --target native
      - run: moon run scripts/native-info.mbtx
      - run: git diff --exit-code
      - run: moon package --list
